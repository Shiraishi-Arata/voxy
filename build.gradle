def gitCommitHash = { ->
    try {
        ExecOutput result = providers.exec {
            commandLine = ['git', 'rev-parse', 'HEAD']
            ignoreExitValue = true
        }

        if (result.getResult().get().getExitValue() != 0) {
            return "<UnknownCommit>";
        } else {
            return result.standardOutput.asText.get().strip();
        }
    } catch (Exception e) {
        e.printStackTrace()
        return "<UnknownCommit>";
    }
}

def buildtime = {System.currentTimeSeconds()}

processResources {
    def time = buildtime()
    def hash = gitCommitHash()
    def version = project.version

    StringBuilder sodium_versions_builder = new StringBuilder("[");
    for (var ver : project.properties.getOrDefault("sodium_extra_allows","").split(" ")) {
        sodium_versions_builder.append("\"=").append(ver).append("\", ");
    }
    def current_sodium_version = project.properties.sodium_version_modrinth.split("-")[1];
    //sodium_versions_builder.append("\"=").append(current_sodium_version).append("\"").append(", ");
    sodium_versions_builder.append("\">=").append(current_sodium_version).append("- <=").append(current_sodium_version).append("\"")
    sodium_versions_builder.append("]");
    var sodium_versions = sodium_versions_builder.toString();

    inputs.properties("version": version, "commit": hash, "buildtime": time, "allowed_sodium_versions": sodium_versions)
    filesMatching("fabric.mod.json") {
        expand "version": version, "commit": hash, "buildtime": time, "allowed_sodium_versions": sodium_versions
    }
}

