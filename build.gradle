abstract class AarToJarTransform implements org.gradle.api.artifacts.transform.TransformAction<org.gradle.api.artifacts.transform.TransformParameters.None> {
    @org.gradle.api.artifacts.transform.InputArtifact
    abstract org.gradle.api.provider.Provider<org.gradle.api.file.FileSystemLocation> getInputArtifact()

    @Override
    void transform(org.gradle.api.artifacts.transform.TransformOutputs outputs) {
        def input = getInputArtifact().get().asFile
        def outputName = input.name.endsWith('.aar') ? input.name.substring(0, input.name.length() - 4) + '.jar' : input.name + '.jar'
        def output = outputs.file(outputName)

        def seen = new java.util.HashSet<String>()
        output.withOutputStream { fileOut ->
            def jarOut = new java.util.zip.ZipOutputStream(fileOut)
            try {
                def aar = new java.util.zip.ZipFile(input)
                try {
                    def classesEntry = aar.getEntry('classes.jar')
                    if (classesEntry != null) {
                        def classesIn = new java.util.zip.ZipInputStream(aar.getInputStream(classesEntry))
                        try {
                            java.util.zip.ZipEntry nestedEntry
                            while ((nestedEntry = classesIn.nextEntry) != null) {
                                if (!nestedEntry.isDirectory() && seen.add(nestedEntry.name)) {
                                    jarOut.putNextEntry(new java.util.zip.ZipEntry(nestedEntry.name))
                                    classesIn.transferTo(jarOut)
                                    jarOut.closeEntry()
                                }
                                classesIn.closeEntry()
                            }
                        } finally {
                            classesIn.close()
                        }
                    }

                    aar.entries().each { entry ->
                        if (!entry.isDirectory() && entry.name.startsWith('jni/') && entry.name.endsWith('.so') && seen.add(entry.name)) {
                            jarOut.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                            aar.getInputStream(entry).withCloseable { it.transferTo(jarOut) }
                            jarOut.closeEntry()
                        }
                    }
                } finally {
                    aar.close()
                }
            } finally {
                jarOut.close()
            }
        }
    }
}

def artifactType = org.gradle.api.attributes.Attribute.of('artifactType', String)

configurations.configureEach { configuration ->
    if (configuration.canBeResolved) {
        configuration.attributes.attribute(artifactType, 'jar')
    }
}

dependencies {
    attributesSchema {
        attribute(artifactType)
    }
    registerTransform(AarToJarTransform) {
        from.attribute(artifactType, 'aar')
        to.attribute(artifactType, 'jar')
    }
    components {
        withModule('io.maryk.rocksdb:rocksdb-android') {
            allVariants {
                attributes {
                    attribute(org.gradle.api.attributes.LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(org.gradle.api.attributes.LibraryElements, org.gradle.api.attributes.LibraryElements.JAR))
                    attribute(org.gradle.api.attributes.java.TargetJvmEnvironment.TARGET_JVM_ENVIRONMENT_ATTRIBUTE, objects.named(org.gradle.api.attributes.java.TargetJvmEnvironment, org.gradle.api.attributes.java.TargetJvmEnvironment.STANDARD_JVM))
                    attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
                }
            }
        }
    }
}

