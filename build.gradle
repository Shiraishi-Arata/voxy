tasks.register("prepareLocalLinuxNativeIncludeJars") {
    def sourceTree = fileTree(dir: "$rootDir/deps", include: ["*lwjgl*natives-linux*.jar"])
    def outputDir = layout.buildDirectory.dir("generated/local-linux-native-include-jars")
    inputs.files(sourceTree)
    outputs.dir(outputDir)

    doLast {
        def outDir = outputDir.get().asFile
        delete(outDir)
        outDir.mkdirs()

        sourceTree.files.each { File inputJar ->
            def outputJar = new File(outDir, inputJar.name)
            def hadFabricModJson = false
            def zipIn = new java.util.zip.ZipInputStream(new FileInputStream(inputJar))
            def zipOut = new java.util.zip.ZipOutputStream(new FileOutputStream(outputJar))
            try {
                byte[] buffer = new byte[8192]
                java.util.zip.ZipEntry entry
                while ((entry = zipIn.nextEntry) != null) {
                    if (entry.name == "fabric.mod.json") {
                        hadFabricModJson = true
                    }
                    def newEntry = new java.util.zip.ZipEntry(entry.name)
                    newEntry.setTime(entry.time)
                    if (entry.method == java.util.zip.ZipEntry.STORED) {
                        newEntry.setMethod(java.util.zip.ZipEntry.STORED)
                        newEntry.setSize(entry.size)
                        newEntry.setCompressedSize(entry.compressedSize)
                        newEntry.setCrc(entry.crc)
                    }
                    zipOut.putNextEntry(newEntry)
                    int read
                    while ((read = zipIn.read(buffer)) > 0) {
                        zipOut.write(buffer, 0, read)
                    }
                    zipOut.closeEntry()
                    zipIn.closeEntry()
                }

                if (!hadFabricModJson) {
                    def matcher = (inputJar.name =~ /^(lwjgl(?:-[A-Za-z0-9]+)*)-([0-9]+(?:\.[0-9]+){1,3})-natives-linux(?:-[A-Za-z0-9]+)?\.jar$/)
                    def moduleName = matcher.matches() ? matcher.group(1).toLowerCase(Locale.ROOT) : inputJar.name.replaceAll(/\.jar$/, "").toLowerCase(Locale.ROOT)
                    def moduleVersion = matcher.matches() ? matcher.group(2) : project.version.toString()
                    def modId = "org_lwjgl_${moduleName}_natives-linux".replaceAll("[^a-z0-9_-]", "_")
                    def json = """{
  "schemaVersion": 1,
  "id": "${modId}",
  "version": "${moduleVersion}",
  "name": "${moduleName}",
  "custom": {
    "fabric-loom:generated": true
  }
}"""
                    zipOut.putNextEntry(new java.util.zip.ZipEntry("fabric.mod.json"))
                    zipOut.write(json.getBytes("UTF-8"))
                    zipOut.closeEntry()
                }
            } finally {
                zipOut.close()
                zipIn.close()
            }
        }
    }
}

