tasks.register('makeExcludedRocksDB', Zip) {
    archiveExtension.set("jar")
    entryCompression = ZipEntryCompression.STORED
    destinationDirectory.set temporaryDir

    dependsOn configurations.includeInternal

    def files = configurations.includeInternal.incoming.getArtifacts().getArtifactFiles().filter {
        it.name.startsWith('rocksdb')
    }
    
    from {->zipTree(files.first())}
    archiveFileName.set(providers.provider{files.first().name})

    exclude {
        def file = it.name
        if (file.endsWith(".jnilib")) {
            return true
        }
        if (!file.endsWith(".so")) {
            return false
        }
        return ["osx", "linux32", "musl", "s390x", "riscv64", "ppc64le", "aarch64"].any(file::contains)
    }
}




processIncludeJars {
    outputs.cacheIf {true}
    dependsOn "prepareLocalLinuxNativeIncludeJars"

    def localLinuxNativeIncludeJars = fileTree(dir: "$buildDir/generated/local-linux-native-include-jars", include: ["*.jar"])
    jars.from(localLinuxNativeIncludeJars)
    // Manually-added jars still need metadata for Loom before it can see their generated fabric.mod.json.
    fileTree(dir: "$rootDir/deps", include: ["*lwjgl*natives-linux*.jar"]).files.each { File inputJar ->
        def matcher = (inputJar.name =~ /^(lwjgl(?:-[A-Za-z0-9]+)*)-([0-9]+(?:\.[0-9]+){1,3})-(natives-linux(?:-[A-Za-z0-9]+)?)\.jar$/)
        if (matcher.matches()) {
            jarIds.put(inputJar.name, new net.fabricmc.loom.build.nesting.NestableJarGenerationTask.Metadata("org.lwjgl", matcher.group(1), matcher.group(2), matcher.group(3)))
        }
    }
    if (!INCLUDE_OTHER_ARCHS) {
        dependsOn makeExcludedRocksDB
        jars = jars.filter {!it.name.startsWith('rocksdb')}
        jars.from(makeExcludedRocksDB)
    }
}

jar {
